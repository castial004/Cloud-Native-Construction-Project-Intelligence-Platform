<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCPIP — {% block title %}Dashboard{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --txt:#e2e8f0; --mut:#94a3b8;
            --accent:#38bdf8; --good:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
    header { background:var(--panel); border-bottom:1px solid var(--line); padding:12px 24px;
             display:flex; align-items:center; gap:24px; position:sticky; top:0; z-index:10; }
    header h1 { font-size:16px; margin:0; color:var(--accent); font-weight:700; }
    nav a { color:var(--mut); text-decoration:none; padding:6px 12px; border-radius:6px; font-size:14px; }
    nav a:hover { color:var(--txt); background:var(--line); }
    nav a.active { color:#fff; background:var(--accent); }
    main { padding:24px; max-width:1300px; margin:0 auto; }
    .grid { display:grid; gap:16px; }
    .kpis { grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); }
    .cards { grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
    .kpi .label { color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    .kpi .value { font-size:26px; font-weight:700; margin-top:6px; }
    .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--mut); font-weight:600; text-transform:uppercase; font-size:11px; }
    tr:hover td { background:#243244; }
    .badge { padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
    .badge.High { background:#7f1d1d; color:#fecaca; }
    .badge.Medium { background:#78350f; color:#fde68a; }
    .badge.Low { background:#14532d; color:#bbf7d0; }
    form.filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:end; }
    select,input[type=file],button { background:#0b1220; color:var(--txt); border:1px solid var(--line);
             border-radius:6px; padding:8px 10px; font-size:13px; }
    button { background:var(--accent); color:#04121f; font-weight:700; cursor:pointer; border:none; }
    button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
    label { font-size:12px; color:var(--mut); display:block; margin-bottom:4px; }
    h2 { font-size:15px; margin:0 0 12px; }
    .muted { color:var(--mut); font-size:13px; }
    .chart-wrap { position:relative; height:280px; }
  </style>
</head>
<body>
<header>
  <h1>CCPIP</h1>
  <nav>
    <a href="/" class="{{ 'active' if active=='overview' }}">Overview</a>
    <a href="/cost" class="{{ 'active' if active=='cost' }}">Cost</a>
    <a href="/schedule" class="{{ 'active' if active=='schedule' }}">Schedule</a>
    <a href="/risk" class="{{ 'active' if active=='risk' }}">Delay-Risk</a>
    <a href="/activities" class="{{ 'active' if active=='activities' }}">Activities</a>
    <a href="/data" class="{{ 'active' if active=='data' }}">Data &amp; Actions</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
