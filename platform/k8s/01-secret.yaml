# NOTE: demo credentials only. In production use sealed-secrets / external secret store.
apiVersion: v1
kind: Secret
metadata:
  name: ccpip-db
  namespace: ccpip
type: Opaque
stringData:
  POSTGRES_USER: ccpip
  POSTGRES_PASSWORD: ccpip
  POSTGRES_DB: ccpip
  CCPIP_DATABASE_URL: postgresql+psycopg2://ccpip:ccpip@db:5432/ccpip
