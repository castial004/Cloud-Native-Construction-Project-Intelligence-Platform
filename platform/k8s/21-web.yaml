apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ccpip
spec:
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ccpip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: platform-web:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.web.app.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: CCPIP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ccpip-db
                  key: CCPIP_DATABASE_URL
          envFrom:
            - configMapRef:
                name: ccpip-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
